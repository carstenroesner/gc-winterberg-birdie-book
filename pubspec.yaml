name: gc_winterberg_birdie_book
description: "Digitales Birdie Book für den 9-Loch-Turnierplatz des GC Winterberg: Löcher, Schläger, Scorecard."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  path_drawing: ^1.0.1
  cupertino_icons: ^1.0.8
  flutter_slidable: ^3.0.0
  pdf: ^3.10.0
  printing: ^5.11.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/holes/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Variable.ttf
