name: Deploy Web

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate web platform scaffolding (only if missing)
        run: |
          if [ ! -d web ]; then
            flutter create --platforms=web .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: |
          flutter test --reporter expanded > /tmp/test_output.txt 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done < /tmp/test_output.txt
          fi
          exit $code

      - name: Build web release
        run: flutter build web --release --base-href /gc-winterberg-birdie-book/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
