name: Deploy Web

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate web platform scaffolding (only if missing)
        run: |
          if [ ! -d web ]; then
            flutter create --platforms=web .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests (mit Diagnose-Annotations)
        run: |
          set -o pipefail
          flutter test --reporter json > /tmp/test-results.jsonl || TEST_EXIT=$?
          python3 - <<'PYEOF'
          import json

          names = {}
          failures = []

          with open('/tmp/test-results.jsonl') as f:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      ev = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  t = ev.get('type')
                  if t == 'testStart':
                      test = ev.get('test', {})
                      names[test.get('id')] = test.get('name')
                  elif t == 'error':
                      tid = ev.get('testID')
                      failures.append({
                          'name': names.get(tid, f'test#{tid}'),
                          'error': ev.get('error', ''),
                          'stackTrace': ev.get('stackTrace', ''),
                      })

          if failures:
              print(f'::error::{len(failures)} Test(s) fehlgeschlagen')
              for fail in failures:
                  msg = (fail['error'] or '').replace('\n', ' | ')[:500]
                  print(f"::error::FAILED: {fail['name']} -- {msg}")
          else:
              print('Keine Fehlschläge in den JSON-Testergebnissen gefunden.')
          PYEOF
          test -z "${TEST_EXIT:-}" || exit "$TEST_EXIT"

      - name: Build web release
        run: flutter build web --release --base-href /gc-winterberg-birdie-book/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
