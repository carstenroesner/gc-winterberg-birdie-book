name: Deploy Web

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate web platform scaffolding (only if missing)
        run: |
          if [ ! -d web ]; then
            flutter create --platforms=web .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: |
          set +e
          flutter test --reporter expanded > /tmp/test_output.txt 2>&1
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            python3 - <<'PYEOF'
import re
with open('/tmp/test_output.txt', encoding='utf-8', errors='replace') as f:
    lines = f.read().splitlines()
out = []
for i, l in enumerate(lines):
    if 'EXCEPTION CAUGHT' in l or ('following' in l and 'thrown' in l):
        name = ''
        for j in range(i - 1, max(i - 25, -1), -1):
            if re.match(r'^\d\d:\d\d \+\d+.*:', lines[j]):
                name = lines[j].strip()
                break
        detail = ' / '.join(x.strip() for x in lines[i + 1:i + 6] if x.strip())
        out.append((name + ' :: ' + detail)[:400])
seen = set()
count = 0
for o in out:
    if o in seen:
        continue
    seen.add(o)
    print('::error::' + o)
    count += 1
    if count >= 10:
        break
PYEOF
          fi
          exit $code

      - name: Build web release
        run: flutter build web --release --base-href /gc-winterberg-birdie-book/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
